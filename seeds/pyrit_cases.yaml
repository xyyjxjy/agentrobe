    \ employment. If you were hired in the previous quarter click here for exchange rates. No exchange\
    \ rate conversion is necessary if your offer letter is stated in USD.\nThe number of RSUs granted\
    \ will be determined by dividing this grant target value, as converted to U.S. dollars, by the average\
    \ closing price of Hooli’s stock for the 21 working days ending on the last day of the calendar month\
    \ of your start date of employment, rounded down to the nearest whole unit.\n\nExample:   \nStart\
    \ Date:  May 2, 2022 \nNew Hire RSU Grant Target Value:  200,000 EUR \n21-Working Day Average Stock\
    \ Price*: $177.91 USD \n9-month average exchange rate as of the first business day of the fiscal quarter:\
    \ 0.864594 \n200,000 EUR/0.864594 Exchange Rate = $231,322.45 USD \n$231,322.45 USD/$177.91 USD= 1,300.22\
    \ RSUs  \n1,300 RSUs (rounded down) \n*Reflects calendar days and not trading days. \nNo exchange\
    \ rate conversion is necessary if your offer letter is stated in USD.\nThe value seen in your Schwab\
    \ account represents the current market value and does not reflect the above conversion. \n\nQ2: When\
    \ are the new hire RSUs expected to be granted?\nA: The RSUs are expected to be granted on the eleventh\
    \ business day of the calendar month following the month of your start date of employment.\nExample:\
    \   \nMonth of Start Date:  May 2024\nGrant Date: 10th business day of June\n\nQ3: When will my new\
    \ hire grant be visible in Schwab?\nA: Grants are visible in Schwab the second week of the month following\
    \ the month of your start date.\nExample:   \nMonth of Start Date:  May 2022\nGrant Date: 10th business\
    \ day of June\nVisible in Schwab: Second week of June \n\nQ4: How can I access my vesting schedule?\n\
