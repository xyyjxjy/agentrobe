    125 metres (410 ft) on each side. During its construction, the Eiffel Tower surpassed the Washington
    Monument to become the tallest human-made structure in the world, a title it held for 41 years until
    the Chrysler Building in New York City was finished in 1930.\nThe tower has three levels for visitors,
    with restaurants on the first and second levels. The top level''s upper platform is 276 m (906 ft)
    above the ground \u2013 the highest observation deck accessible to the public in the European Union.\nOn
    20 November 1913, the Paris Observatory, using the Eiffel Tower as an aerial, exchanged wireless signals
    with the United States Naval Observatory, which used an aerial in Arlington County, Virginia. The
