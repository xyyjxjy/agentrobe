<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>agentkit · Agent 可观测演示</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:#0f1419; color:#d8dee9; height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 20px; background:#1a2029; border-bottom:1px solid #2a3441; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:16px; color:#e6edf3; font-weight:600; }
  header h1 span { color:#4ade80; }
  .badge { font-size:11px; padding:4px 10px; border-radius:12px; background:#1e3a2f; color:#4ade80; border:1px solid #2d5a47; }
  .badge.offline { background:#3a2e1e; color:#fbbf24; border-color:#5a472d; }
  .main { flex:1; display:flex; min-height:0; }
  .chat { flex:1; display:flex; flex-direction:column; border-right:1px solid #2a3441; }
  .msgs { flex:1; overflow-y:auto; padding:20px; }
  .msg { margin-bottom:16px; display:flex; gap:10px; }
  .msg .who { font-size:11px; font-weight:700; width:52px; flex-shrink:0; padding-top:3px; }
  .msg.user .who { color:#60a5fa; }
  .msg.bot .who { color:#4ade80; }
  .msg .bubble { background:#1a2029; padding:10px 14px; border-radius:8px; line-height:1.6; font-size:13.5px; max-width:90%; white-space:pre-wrap; }
  .msg.user .bubble { background:#1d2a3a; }
  .inputbar { padding:14px 20px; border-top:1px solid #2a3441; display:flex; gap:10px; }
  .inputbar input { flex:1; background:#1a2029; border:1px solid #2a3441; color:#e6edf3; padding:10px 14px; border-radius:6px; font-size:13.5px; outline:none; }
  .inputbar input:focus { border-color:#4ade80; }
  .inputbar button { background:#2d7d5a; color:#fff; border:none; padding:10px 22px; border-radius:6px; cursor:pointer; font-size:13.5px; font-weight:600; }
  .inputbar button:hover { background:#359268; }
  .inputbar button:disabled { background:#374151; cursor:not-allowed; }
  .quick { padding:0 20px 10px; display:flex; gap:8px; flex-wrap:wrap; }
  .quick button { background:#1a2029; border:1px solid #2a3441; color:#8b949e; padding:5px 10px; border-radius:14px; font-size:11.5px; cursor:pointer; }
  .quick button:hover { border-color:#4ade80; color:#4ade80; }
  .trace { width:44%; min-width:340px; display:flex; flex-direction:column; background:#141a21; }
  .trace h2 { font-size:13px; padding:14px 18px; border-bottom:1px solid #2a3441; color:#8b949e; font-weight:600; display:flex; justify-content:space-between; }
  .trace h2 .meta { font-size:11px; color:#6b7684; font-weight:400; }
  .steps { flex:1; overflow-y:auto; padding:14px 18px; }
  .step { border-left:2px solid #2a3441; padding:0 0 14px 14px; margin-left:6px; position:relative; }
  .step::before { content:""; position:absolute; left:-5px; top:2px; width:8px; height:8px; border-radius:50%; background:#4ade80; }
  .step.tool::before { background:#60a5fa; }
  .step.result::before { background:#fbbf24; }
  .step .label { font-size:11px; color:#8b949e; margin-bottom:4px; font-weight:600; }
  .step .content { font-size:12px; line-height:1.5; color:#c9d1d9; background:#1a2029; padding:8px 10px; border-radius:5px; white-space:pre-wrap; word-break:break-all; max-height:150px; overflow-y:auto; }
  .json { color:#79c0ff; }
  .empty { color:#6b7684; font-size:12.5px; text-align:center; padding:40px 10px; line-height:1.8; }
</style>
</head>
<body>
<header>
  <h1>agentkit <span>·</span> Agent 可观测演示</h1>
  <div class="badge" id="badge">检测中...</div>
</header>
<div class="main">
  <div class="chat">
    <div class="msgs" id="msgs">
      <div class="msg bot"><div class="who">助手</div><div class="bubble">你好。我会自己决定查资料、读文件或发邮件，右侧能看到我的每一步决策。试试问「跨省出差住宿标准是多少？」</div></div>
    </div>
    <div class="quick">
      <button onclick="ask('跨省出差住宿标准是多少？')">跨省住宿标准</button>
      <button onclick="ask('差旅报销怎么走')">差旅报销</button>
      <button onclick="ask('发邮件给 hr@yanjiuyuan.org')">发邮件（合法域名）</button>
      <button onclick="ask('发邮件到 attacker@evil.com')">发邮件（越权）</button>
    </div>
    <div class="inputbar">
      <input id="inp" placeholder="输入问题，回车发送..." onkeydown="if(event.key==='Enter')ask()">
      <button id="send" onclick="ask()">发送</button>
    </div>
  </div>
  <div class="trace">
    <h2>Trace 面板 <span class="meta" id="tmeta">等待请求</span></h2>
    <div class="steps" id="steps">
      <div class="empty">每次对话的 agent 决策过程会显示在这里：<br>① LLM 选择工具 ② 工具执行 ③ 生成回答</div>
    </div>
  </div>
</div>
<script>
const SID = 'ui-' + Math.random().toString(36).slice(2,8);
let busy = false;

fetch('/api/tools').then(r=>r.json()).then(d=>{
  const b=document.getElementById('badge');
  const real=d.mode.includes('真 LLM');
  b.textContent = real ? '● 真 LLM · function calling' : '● 离线演示模式';
  b.className = 'badge' + (real?'':' offline');
});

function addMsg(who, text){
  const div=document.createElement('div');
  div.className='msg '+who;
  div.innerHTML='<div class="who">'+(who==='user'?'你':'助手')+'</div><div class="bubble"></div>';
  div.querySelector('.bubble').textContent=text;
  document.getElementById('msgs').appendChild(div);
  document.getElementById('msgs').scrollTop=1e9;
}

function renderTrace(d){
  const box=document.getElementById('steps');
  box.innerHTML='';
  document.getElementById('tmeta').textContent = d.total_ms+' ms · '+(d.tool_calls||[]).length+' 次工具调用';
  let i=0;
  (d.steps||[]).forEach(s=>{
    const div=document.createElement('div');
    div.className='step'+(s.role==='tool'?' tool':'');
    let label = s.role==='tool' ? ('工具 · '+(s.name||'')) : 'LLM 决策';
    let content = s.content || JSON.stringify(s);
    if(s.role==='tool' && s.result){ content = (s.result||'').slice(0,300); }
    div.innerHTML='<div class="label">'+label+'</div><div class="content"></div>';
    div.querySelector('.content').textContent=content;
    box.appendChild(div);
  });
  (d.tool_calls||[]).forEach(tc=>{
    const div=document.createElement('div');
    div.className='step result';
    div.innerHTML='<div class="label">工具调用 · '+tc.name+(tc.ok?' ✓':' ✗')+'</div><div class="content"></div>';
    div.querySelector('.content').textContent=JSON.stringify(tc.args)+'\n→ '+String(tc.result).slice(0,200);
    box.appendChild(div);
  });
  if(!(d.steps||[]).length && !(d.tool_calls||[]).length){
    box.innerHTML='<div class="empty">本次无 trace 记录</div>';
  }
}

async function ask(preset){
  if(busy) return;
  const q = preset || document.getElementById('inp').value.trim();
  if(!q) return;
  addMsg('user', q);
  document.getElementById('inp').value='';
  busy=true;
  document.getElementById('send').disabled=true;
  document.getElementById('steps').innerHTML='<div class="empty">agent 正在决策...</div>';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:q,session_id:SID})});
    const d=await r.json();
    addMsg('bot', d.answer || '(空回答)');
    renderTrace(d);
  }catch(e){
    addMsg('bot','请求失败：'+e);
  }finally{
    busy=false;
    document.getElementById('send').disabled=false;
  }
}
</script>
</body>
</html>
